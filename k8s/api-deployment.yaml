apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopper-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopper-api
  template:
    metadata:
      labels:
        app: shopper-api
    spec:
      imagePullSecrets:
        - name: ecr-pull
      containers:
        - name: api
          image: 341587306056.dkr.ecr.eu-west-3.amazonaws.com/shopper-api:v3
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
              name: shopper-config
            - secretRef:
              name: shopper-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10