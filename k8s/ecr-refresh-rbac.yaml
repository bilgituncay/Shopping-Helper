apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-refresher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-refresher
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ecr-pull"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-refresher
subjects:
  - kind: ServiceAccount
    name: ecr-refresher
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-refresher