name: build-and-push

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: 341587306056.dkr.ecr.eu-west-3.amazonaws.com

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Debug OIDC claims
        run: |
          python3 - <<'EOF'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for k in ("sub", "aud", "repository", "ref"):
              print(k, "=", claims.get(k))
          EOF

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::341587306056:role/github-actions-shopper-ecr
          aws-region: eu-west-3

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build images
        run: |
          docker build -f api/Dockerfile -t $REGISTRY/shopper-api:$TAG .
          docker build -f worker/Dockerfile -t $REGISTRY/shopper-worker:$TAG .

      - name: Smoke test
        run: |
          docker run --rm $REGISTRY/shopper-api:$TAG python -c "import api.main"
          docker run --rm $REGISTRY/shopper-worker:$TAG python -c "import worker.tasks"

      - name: Push images
        run: |
          docker push $REGISTRY/shopper-api:$TAG
          docker push $REGISTRY/shopper-worker:$TAG